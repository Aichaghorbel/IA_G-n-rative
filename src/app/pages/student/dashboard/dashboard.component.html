<div class="space-y-6">
  <!-- Welcome Header -->
  <div class="relative rounded-2xl overflow-hidden shadow-lg backdrop-blur-md"
    [style.background]="'linear-gradient(135deg, rgba(0,175,185,0.5), rgba(0,175,185,0.9))'">
    <div class="h-48 bg-slate-800 relative">
      <!-- Background Pattern placeholder -->
      <div class="absolute inset-0 opacity-30 bg-cover bg-center"
        style="background-image: url('assets/images/couverture2.jpg')"></div>

      <div
        class="relative z-10 h-full flex flex-col md:flex-row items-start md:items-center justify-between p-6 md:p-8 gap-4">
        <div class="text-white">
          <h2 class="text-3xl md:text-4xl font-bold mb-2">
            Bonjour, {{ firstName() }}
          </h2>
          <p class="text-white/80 text-base max-w-lg leading-relaxed">
            Bienvenue sur votre espace SmartCampus.
          </p>
        </div>
        <!-- <button (click)="navigateToChat()" -->
        <button class="flex items-center gap-2 bg-white/90 text-slate-800 px-6 py-3 rounded-xl text-sm font-semibold
          hover:bg-white hover:scale-105 transition-all duration-300 shadow-md shrink-0">
          <lucide-icon name="message-square" class="w-5 h-5 text-[#1d4b99]"></lucide-icon>
          <span>Poser une question</span>
        </button>
      </div>
    </div>
  </div>
