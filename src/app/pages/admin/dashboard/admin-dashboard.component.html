<div class="space-y-8 font-sans pb-12">
  <!-- Stats Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
    <div
      *ngFor="let stat of stats"
      [@fadeInUp]
      class="bg-white rounded-xl p-6 shadow-sm border border-slate-200 flex items-center space-x-4 hover:shadow-md transition-shadow"
    >
      <div [class]="'p-3 rounded-lg ' + stat.bg">
        <lucide-icon
          [name]="stat.icon"
          [class]="'w-6 h-6 ' + stat.color"
          [style.fill]="stat.fill ? 'currentColor' : 'none'"
        ></lucide-icon>
      </div>
      <div>
        <p class="text-sm font-medium text-slate-500">{{ stat.label }}</p>
        <h3 class="text-2xl font-bold text-slate-900">{{ stat.value }}</h3>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Chart Section -->
    <div class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col min-h-[400px]">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-8 gap-4">
        <div>
          <h2 class="text-lg font-bold text-slate-900">Inscriptions</h2>
          <p class="text-sm text-slate-500">Évolution des nouvelles inscriptions</p>
        </div>
        <div class="flex bg-slate-100 p-1.5 rounded-xl">
          <button
            (click)="setChartTab('semaine')"
            class="px-4 py-1.5 text-sm font-medium rounded-lg transition-all duration-200"
            [class.text-white]="chartTab() === 'semaine'"
            [class.shadow-sm]="chartTab() === 'semaine'"
            [class.text-slate-500]="chartTab() !== 'semaine'"
            [style.backgroundColor]="chartTab() === 'semaine' ? '#1d4b99' : 'transparent'"
          >
            Cette semaine
          </button>
          <button
            (click)="setChartTab('mois')"
            class="px-4 py-1.5 text-sm font-medium rounded-lg transition-all duration-200"
            [class.text-white]="chartTab() === 'mois'"
            [class.shadow-sm]="chartTab() === 'mois'"
            [class.text-slate-500]="chartTab() !== 'mois'"
            [style.backgroundColor]="chartTab() === 'mois' ? '#1d4b99' : 'transparent'"
          >
            Ce mois
          </button>
        </div>
      </div>

      <!-- Chart.js Canvas -->
      <div class="flex-1 w-full relative mt-4" style="min-height: 280px;">
        <canvas id="inscriptionsChart"></canvas>
      </div>
    </div>

    <!-- Recent Students Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
      <div class="p-6 border-b border-slate-100 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-900">Inscriptions récentes</h2>
        <button routerLink="/admin/students" class="text-sm text-[#1d4b99] font-medium hover:underline">Voir tout</button>
      </div>
      <div class="flex-1 overflow-auto">
        <table class="w-full text-sm text-left">
          <thead class="text-xs text-slate-500 uppercase bg-slate-50">
            <tr>
              <th class="px-6 py-3 font-bold">Étudiant</th>
              <th class="px-6 py-3 font-bold">Statut</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-100">
            <tr *ngFor="let student of recentStudents" class="hover:bg-slate-50 transition-colors">
              <td class="px-6 py-4">
                <div class="font-bold text-slate-900">{{ student.name }}</div>
                <div class="text-slate-500 text-xs">{{ student.field }}</div>
              </td>
              <td class="px-6 py-4">
                <span
                  class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider"
                  [ngClass]="{
                    'bg-emerald-100 text-emerald-700': student.status === 'Actif',
                    'bg-amber-100 text-amber-700': student.status === 'En attente',
                    'bg-slate-100 text-slate-700': student.status === 'Inactif'
                  }"
                >
                  <lucide-icon [name]="student.status === 'Actif' ? 'check-circle' : 'x-circle'"
                    class="w-3.5 h-3.5 mr-1.5"></lucide-icon>
                  {{ student.status }}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bottom Row -->
  <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <!-- FAQ Stats -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200">
      <div class="p-6 border-b border-slate-100">
        <h2 class="text-lg font-bold text-slate-900">Questions fréquentes</h2>
      </div>
      <div class="p-4 space-y-2">
        <div
          *ngFor="let q of topQuestions"
          class="flex items-center justify-between p-3.5 hover:bg-slate-50 rounded-xl transition-all group"
        >
          <div class="flex items-center gap-4">
            <div [class]="'w-10 h-10 rounded-xl flex items-center justify-center transition-transform group-hover:scale-110 ' + q.bg">
              <lucide-icon [name]="q.icon" [class]="'w-5 h-5 ' + q.color"></lucide-icon>
            </div>
            <span class="text-sm font-bold text-slate-700">{{ q.text }}</span>
          </div>
          <span class="text-xs font-bold text-slate-400 bg-slate-100 px-3 py-1.5 rounded-lg">
            {{ q.count }}
          </span>
        </div>
      </div>
    </div>

    <!-- Categories Allocation -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-lg font-bold text-slate-900 mb-8">Répartition par catégorie</h2>
      <div class="space-y-7">
        <div *ngFor="let cat of categories">
          <div class="flex justify-between items-end mb-2.5">
            <span class="text-sm font-bold text-slate-600">{{ cat.name }}</span>
            <span class="text-sm font-bold text-slate-400">{{ cat.percent }}%</span>
          </div>
          <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div
              class="h-full rounded-full transition-all duration-1000 ease-out"
              [class]="cat.color"
              [style.width.%]="cat.percent"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
