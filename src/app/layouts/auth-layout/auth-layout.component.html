<div class="min-h-screen flex items-center justify-center bg-slate-50 font-sans p-4">
  <div class="w-full max-w-5xl flex flex-col md:flex-row bg-white rounded-2xl shadow-xl overflow-hidden">

    <!-- Left side - Video Background -->
    <div class="md:w-1/2 relative overflow-hidden bg-[#1d4b99]">
      <video
        #bgVideo
        autoplay
        loop
        [muted]="true"
        playsinline
        class="absolute inset-0 w-full h-full object-cover"
      >
        <source src="assets/videos/s4.mp4" type="video/mp4" />
      </video>
      <!-- Gradient overlay -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
    </div>

    <!-- Right side - Form content -->
    <div class="md:w-1/2 flex items-center justify-center p-8 md:p-12 bg-white">
      <div class="w-full max-w-md">
        <router-outlet></router-outlet>
        <ng-content></ng-content>
      </div>
    </div>

  </div>
</div>
